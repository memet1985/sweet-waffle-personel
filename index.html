<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle - Merkez Yönetim Girişi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #e8dcc4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #e2d1b1;
            position: relative;
            text-align: center;
        }

        /* Sol Üst X Butonu */
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f1f1f1;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #e0e0e0;
            color: #000;
        }

        .logo-container {
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .logo-container img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4a373;
        }

        h2 {
            font-size: 20px;
            color: #3b2f2f;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a3c31;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4a373;
            border-radius: 8px;
            background-color: #fcf9f2;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        input::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: #4a3525;
            color: #fff;
        }

        .btn-success {
            background-color: #27ae60;
            color: #fff;
        }

        .btn-secondary {
            background-color: #7f8c8d;
            color: #fff;
        }
        
        .qr-section {
            margin-top: 20px;
            border-top: 1px dashed #d4a373;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Sol Üst X Butonu (Güvenli Yönlendirme) -->
        <button class="close-btn" onclick="handleClose()" title="Kapat / Ana Menüye Dön">✕</button>

        <div class="logo-container">
            <!-- Örnek Logo (Varsa Kendi Logonuzu Ekleyin) -->
            <div style="width:70px; height:70px; background:#d4a373; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;">SW</div>
        </div>

        <h2>Sweet Waffle</h2>
        <div class="subtitle">
            <span>🏢</span> Merkez Yönetim Girişi
        </div>

        <div class="form-group">
            <label>Yönetici Seçin:</label>
            <select id="yoneticiSecim">
                <option value="merkez">Merkez Yetkilisi</option>
                <option value="yonetici2">Şube Müdürü</option>
            </select>
        </div>

        <div class="form-group">
            <label>Yönetici Şifresi:</label>
            <input type="password" id="sifreInput" placeholder="Şifrenizi girin">
        </div>

        <button class="btn btn-primary" onclick="paneleGirisYap()">Panele Giriş Yap</button>
        <button class="btn btn-success" onclick="biyometrikGiris()">📱 Biyometrik Giriş (Yüz Tanıma / Parmak İzi)</button>
        <button class="btn btn-secondary" onclick="anaMenuyeDon()">← Ana Menüye Dön</button>

        <!-- QR Kod Alanı ve JPG İndirme Butonu -->
        <div class="qr-section">
            <canvas id="qrCanvas" width="120" height="120" style="display:none; margin: 0 auto 10px auto;"></canvas>
            <button class="btn btn-primary" style="background-color: #d4a373;" onclick="qrsizIndirJpg()">QR Kodu JPG Olarak İndir</button>
        </div>
    </div>

    <script>
        // 1. Sol üstteki X butonuna basıldığında şifresiz merkeze girmek yerine ana menüye veya güvenli sayfaya yönlendirir
        function handleClose() {
            // Şifresiz giriş engellendi, ana menüye veya çıkış sayfasına yönlendiriliyor
            alert("Güvenli çıkış yapılıyor, ana menüye yönlendiriliyorsunuz.");
            window.location.href = " ana-menu.html"; // Kendi ana menü sayfanızın yoluyla değiştirebilirsiniz
        }

        function paneleGirisYap() {
            const sifre = document.getElementById('sifreInput').value;
            if(!sifre) {
                alert("Lütfen yönetici şifresini girin!");
                return;
            }
            // Şifre kontrol simülasyonu
            alert("Giriş yapılıyor...");
        }

        function biyometrikGiris() {
            alert("Biyometrik doğrulama başlatılıyor...");
        }

        function anaMenuyeDon() {
            window.location.href = " ana-menu.html";
        }

        // 2. QR Kodu JPG Formatında İndirme Fonksiyonu (Çalışır Hale Getirildi)
        function qrsizIndirJpg() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');

            // Basit bir örnek QR çizimi (veya mevcut QR görselinizi canvas'a aktarabilirsiniz)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#000000";
            ctx.fillRect(10, 10, 40, 40);
            ctx.fillRect(70, 10, 40, 40);
            ctx.fillRect(10, 70, 40, 40);
            ctx.fillStyle = "#d4a373";
            ctx.fillRect(50, 50, 20, 20);

            canvas.style.display = "block";

            // Canvas içeriğini JPG olarak dönüştürüp indirme tetikleme
            const imageURL = canvas.toDataURL("image/jpeg", 1.0);
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = 'sweet-waffle-merkez-qr.jpg';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
