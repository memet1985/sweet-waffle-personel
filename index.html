<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle - Yönetim Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .message-form input, .message-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .message-form textarea { height: 80px; resize: vertical; }
        .btn-primary { background: #5cb85c; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 20px; }
        .msg-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 5px; background: #fafafa; border-radius: 4px; }
        .btn-edit { background: #f0ad4e; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        .btn-delete { background: #d9534f; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .btn-pdf { background: #0275d8; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin-top: 20px; width: 100%; }
    </style>
    <!-- jsPDF Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="container">
    <h3>Sweet Waffle - Merkez Duyuru ve Mesaj Yönetimi</h3>
    
    <!-- Yeni Mesaj Gönderme Formu -->
    <div class="message-form">
        <input type="text" id="msgTitle" placeholder="Bildirim Başlığı" value="Sweet Waffle Duyuru">
        <textarea id="msgBody" placeholder="Gönderilecek mesajı buraya yazın..."></textarea>
        <button onclick="sendPushNotificationToAll()" class="btn-primary">Tüm Cihazlara Kilit Ekranı Bildirimi Gönder</button>
    </div>

    <!-- Gönderilmiş Mesajlar Listesi (Sil / Düzenle Özellikli) -->
    <h4>Geçmiş Mesajlar ve Duyurular</h4>
    <div id="adminMessagesList">
        <!-- Dinamik olarak buraya yüklenecek -->
    </div>

    <!-- Rapor İndirme Butonu -->
    <button onclick="exportToPDF()" class="btn-pdf">Calışma Raporunu PDF İndir</button>
</div>

<script>
    // Global Log Önbelleği (PDF için)
    window.globalLogsCache = [
        { staff_name: "Merkez Kullanıcı", branch: "Merkez", action: "Sistem Kontrolü", date: "2026-07-30", time: "21:00" }
    ];

    // Merkez Panel Mesaj Yönetimi Verileri
    let cachedMessages = [
        { id: 1, title: "Sweet Waffle", body: "Yeni vardiya çizelgesi yayınlandı." },
        { id: 2, title: "Sweet Waffle", body: "Stok kontrolü yapılması unutulmasın." }
    ];

    function renderAdminMessages() {
        const container = document.getElementById('adminMessagesList');
        if (!container) return;
        
        container.innerHTML = '';
        cachedMessages.forEach((msg) => {
            container.innerHTML += `
                <div class="msg-item" id="msg-row-${msg.id}">
                    <div>
                        <strong>${msg.title}</strong>: <span id="msg-text-${msg.id}">${msg.body}</span>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="editMessage(${msg.id})">Düzenle</button>
                        <button class="btn-delete" onclick="deleteMessage(${msg.id})">Sil</button>
                    </div>
                </div>
            `;
        });
    }

    // Mesaj Silme Fonksiyonu
    function deleteMessage(id) {
        if (confirm("Bu mesajı silmek istediğinize emin misiniz?")) {
            cachedMessages = cachedMessages.filter(m => m.id !== id);
            renderAdminMessages();
            alert("Mesaj başarıyla silindi.");
        }
    }

    // Mesaj Düzenleme Fonksiyonu
    function editMessage(id) {
        const msg = cachedMessages.find(m => m.id === id);
        if (!msg) return;

        const newText = prompt("Mesajın yeni içeriğini girin:", msg.body);
        if (newText !== null && newText.trim() !== "") {
            msg.body = newText.trim();
            renderAdminMessages();
            alert("Mesaj başarıyla güncellendi.");
        }
    }

    // Kilit Ekranına Bildirim Tetikleme Mekanizması
    async function sendPushNotificationToAll() {
        const title = document.getElementById('msgTitle').value;
        const body = document.getElementById('msgBody').value;

        if (!body.trim()) {
            alert("Lütfen gönderilecek mesajı boş bırakmayın!");
            return;
        }

        if ('serviceWorker' in navigator) {
            const registration = await navigator.serviceWorker.ready;
            if (registration && registration.showNotification) {
                registration.showNotification(title, {
                    body: body,
                    icon: 'logo.webp',
                    badge: 'logo.webp',
                    vibrate: [200, 100, 200],
                    tag: 'sweet-waffle-notification',
                    renotify: true
                });
                alert("Kilit ekranı bildirimi başarıyla tetiklendi!");
                
                cachedMessages.push({ id: Date.now(), title: title, body: body });
                renderAdminMessages();
                document.getElementById('msgBody').value = '';
            } else {
                alert("Tarayıcınız arka plan bildirimlerini desteklemiyor veya izin verilmedi.");
            }
        } else {
            alert("Service Worker bu tarayıcıda desteklenmiyor.");
        }
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Sweet Waffle - Calisma Raporu", 14, 15);
        let y = 25;
        window.globalLogsCache.slice(0, 25).forEach((log, index) => {
            doc.text(`${index+1}. ${log.staff_name} - ${log.branch} - ${log.action} (${log.date} ${log.time})`, 14, y);
            y += 8;
            if(y > 280) { doc.addPage(); y = 20; }
        });
        doc.save("SweetWaffle_Rapor.pdf");
    }

    // Sayfa açıldığında mesajları listele
    window.onload = function() {
        renderAdminMessages();
    };

    // Telefon kilit ekranı ve arka plan bildirim altyapısını başlatma
    if ('serviceWorker' in navigator && 'Notification' in window) {
        navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
                console.log('Sweet Waffle Arka Plan Servisi Aktif');
                
                Notification.requestPermission().then(function(permission) {
                    if (permission === 'granted') {
                        console.log('Kilit ekranı bildirim izni onaylandı.');
                    }
                });
            })
            .catch(function(error) {
                console.log('Servis kaydı başarısız:', error);
            });
    }
</script>
</body>
</html>
