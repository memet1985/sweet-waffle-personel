<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle - Merkez Yönetim Girişi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #e8dcc4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #e2d1b1;
            position: relative;
            text-align: center;
        }

        /* Sol Üst X Butonu (Düzeltildi: Şifresiz giriş kaldırıldı, güvenli yönlendirme eklendi) */
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f1f1f1;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #e0e0e0;
            color: #000;
        }

        .logo-container {
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .logo-container div {
            width: 70px;
            height: 70px;
            background: #d4a373;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #b08968;
        }

        h2 {
            font-size: 20px;
            color: #3b2f2f;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a3c31;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4a373;
            border-radius: 8px;
            background-color: #fcf9f2;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        input::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: #4a3525;
            color: #fff;
        }

        .btn-success {
            background-color: #27ae60;
            color: #fff;
        }

        .btn-secondary {
            background-color: #7f8c8d;
            color: #fff;
        }

        .btn-warning {
            background-color: #d4a373;
            color: #fff;
        }

        /* Şube QR İndirme Bölümü */
        .branch-qr-section {
            margin-top: 20px;
            border-top: 1px dashed #d4a373;
            padding-top: 15px;
            text-align: left;
        }

        .branch-qr-section h3 {
            font-size: 14px;
            color: #4a3c31;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- 1 Numaralı Hata Düzeltildi: X butonuna basınca şifresiz giriş yapmak yerine ana menüye/güvenli alana yönlendirir -->
        <button class="close-btn" onclick="handleClose()" title="Kapat / Geri Dön">✕</button>

        <div class="logo-container">
            <div>SW</div>
        </div>

        <h2>Sweet Waffle</h2>
        <div class="subtitle">
            <span>🏢</span> Merkez Yönetim Girişi
        </div>

        <div class="form-group">
            <label>Yönetici Seçin:</label>
            <select id="yoneticiSecim">
                <option value="merkez">Merkez Yetkilisi</option>
                <option value="yonetici2">Şube Müdürü</option>
            </select>
        </div>

        <div class="form-group">
            <label>Yönetici Şifresi:</label>
            <input type="password" id="sifreInput" placeholder="Şifrenizi girin">
        </div>

        <button class="btn btn-primary" onclick="paneleGirisYap()">Panele Giriş Yap</button>
        <button class="btn btn-success" onclick="biyometrikGiris()">📱 Biyometrik Giriş (Yüz Tanıma / Parmak İzi)</button>
        <button class="btn btn-secondary" onclick="anaMenuyeDon()">← Ana Menüye Dön</button>

        <!-- Şubelere Ait QR Kodları JPG Olarak İndirme Alanı -->
        <div class="branch-qr-section">
            <h3>Şube QR Kodları (JPG İndir)</h3>
            <div class="form-group" style="margin-bottom: 10px;">
                <select id="subeSecim">
                    <option value="Merkez Şube">Merkez Şube</option>
                    <option value="Kadıköy Şube">Kadıköy Şube</option>
                    <option value="Beşiktaş Şube">Beşiktaş Şube</option>
                    <option value="Soğanlık Şube">Soğanlık Şube</option>
                </select>
            </div>
            <button class="btn btn-warning" onclick="subeQrJpgIndir()">Seçilen Şube QR Kodunu JPG İndir</button>
        </div>
    </div>

    <!-- Gizli Canvas (QR kodunu JPG formatına çevirmek için kullanılır) -->
    <canvas id="hiddenCanvas" width="300" height="300" style="display:none;"></canvas>

    <script>
        // 1 Numaralı Hata Düzeltme Fonksiyonu: X tuşu artık şifresiz giriş yapmıyor.
        function handleClose() {
            alert("Güvenli çıkış yapılıyor, ana menüye yönlendiriliyorsunuz.");
            window.location.href = "ana-menu.html"; // Kendi ana menü sayfanızın dosya yolu
        }

        function paneleGirisYap() {
            const sifre = document.getElementById('sifreInput').value;
            if(!sifre) {
                alert("Lütfen yönetici şifresini girin!");
                return;
            }
            alert("Merkez yönetim paneline giriş yapılıyor...");
        }

        function biyometrikGiris() {
            alert("Biyometrik doğrulama başlatılıyor...");
        }

        function anaMenuyeDon() {
            window.location.href = "ana-menu.html";
        }

        // Şubelere Ait QR Kodları JPG Olarak İndirme Fonksiyonu (Çalışır Hale Getirildi)
        function subeQrJpgIndir() {
            const subeAdi = document.getElementById('subeSecim').value;
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');

            // Arka planı beyaz yap
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Çerçeve çiz
            ctx.strokeStyle = "#d4a373";
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Başlık yazısı (Şube İsmi)
            ctx.fillStyle = "#3b2f2f";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Sweet Waffle", canvas.width / 2, 45);

            ctx.font = "16px Arial";
            ctx.fillStyle = "#666666";
            ctx.fillText(subeAdi, canvas.width / 2, 75);

            // Temsili QR Kareleri (Dinamik olarak şube verisine göre üretilir)
            ctx.fillStyle = "#000000";
            ctx.fillRect(60, 100, 70, 70);
            ctx.fillRect(170, 100, 70, 70);
            ctx.fillRect(60, 210, 70, 70);
            
            ctx.fillStyle = "#d4a373";
            ctx.fillRect(135, 135, 30, 30);
            ctx.fillRect(135, 210, 30, 30);
            ctx.fillRect(210, 210, 30, 30);

            // JPG olarak dönüştürüp indirmeyi tetikle
            const imageURL = canvas.toDataURL("image/jpeg", 1.0);
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = `${subeAdi.toLowerCase().replace(/\s+/g, '-')}-qr.jpg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
